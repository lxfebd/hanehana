# electron-builder 配置。
# 关键点：extraResources 放 Rust 引擎（独立子进程，进 asar 就 spawn 不了）。
# 下载引擎复用 FastDrop 的方案，后续把 engine-rs 接进来后在此注册产物。

appId: com.hanehana.app
productName: HaneHana
executableName: hanehana

directories:
  output: release
  buildResources: build

electronDist: node_modules/electron/dist

files:
  - out/**/*
  - package.json
  - '!node_modules/**/*'

win:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: lxfebd
  repo: hanehana
