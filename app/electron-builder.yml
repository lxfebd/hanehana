# electron-builder 配置。
# 关键点：extraResources 放 Rust 引擎（独立子进程，进 asar 就 spawn 不了）。
# 漏配这一项，打包后的应用启动正常、一点下载才报「Rust 引擎未找到」。

appId: com.hanehana.app
productName: HaneHana
executableName: hanehana

directories:
  output: release
  buildResources: build

electronDist: node_modules/electron/dist

files:
  - out/**/*
  - package.json
  - '!node_modules/**/*'

extraResources:
  # 引擎必须在 asar 外：主进程 spawn 的是真实文件路径。
  # 缺这个 exe 时打包产物启动正常、点下载才报错，故 CI 有解包 smoke 守门。
  - from: ../engine-rs/target/release/fastdrop-engine.exe
    to: fastdrop-engine.exe
  # 浏览器扩展也必须在 asar 外：用户在 Chrome 里「加载已解压的扩展程序」
  # 选的是一个真实目录，asar 里的文件浏览器读不出来。
  # 宿主清单里的 allowed_origins 写死了扩展 ID，扩展 manifest 的 key 必须和
  # src/shared/nmProtocol.ts 的 NM_EXTENSION_ID 对得上——那三处要一起改。
  - from: extension
    to: extension

win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: lxfebd
  repo: hanehana
