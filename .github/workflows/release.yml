# 发版：打 tag 即触发。
# 只在 workflow 内用 --publish always（本地 dist 脚本保持 --publish never，见 package.json）：
# electron-builder 会把 nsis 安装包 + latest.yml + blockmap 一起推 GitHub Release，
# 应用内 autoUpdater 靠 latest.yml 发现新版本。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # 注意：不要加 fetch-tags: true —— tag 触发的 run 里 checkout 会把 SHA 与 tag
      # 都映射到 refs/tags/<name>，报 "Cannot fetch both ..." 直接失败。
      # electron-builder 不用本地 tag 也能把 draft 建在版本 tag 上，发布由下方步骤负责。
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 ci.yml 同步：Electron 44 要求 Node >= 22.12
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      # Electron 44 起 npm 不再 postinstall 下载二进制；electron-builder 打包要它
      - name: install electron binary
        working-directory: app
        run: npx install-electron

      - name: typecheck
        working-directory: app
        run: npm run typecheck
        env:
          PYTHONIOENCODING: utf-8

      - name: build
        working-directory: app
        run: npm run build

      - name: cargo build release (引擎产物)
        working-directory: engine-rs
        run: cargo build --release --locked

      - name: dist (publish 到 GitHub Release)
        working-directory: app
        run: npx electron-vite build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: dist:dir smoke（解包产物可启动 + hello 通）
        working-directory: app
        run: npx electron-builder --dir && node scripts/smoke_packaged.mjs
        env:
          PYTHONIOENCODING: utf-8

      # electron-builder 只建 draft release 并上传资产，不会自己发布；smoke 通过后才显式发布，
      # 这样 smoke 失败的版本不会以已发布状态出现在 Release 页。
      - name: publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $rels = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $h
          $rel = $rels | Where-Object { $_.tag_name -eq $env:TAG } | Select-Object -First 1
          if (-not $rel) { Write-Error "no release found for tag $env:TAG"; exit 1 }
          if (-not $rel.draft) { Write-Output "release already published: $($rel.html_url)"; exit 0 }
          $body = @{ draft = $false; prerelease = $false; name = "HaneHana $env:TAG" } | ConvertTo-Json
          Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($rel.id)" -Headers $h -Body $body | Out-Null
          Write-Output "published: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG"
