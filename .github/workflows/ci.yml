# 守门三件套：clone 可构建 + 类型零错 + Rust 单测真的被跑。
# 任何一项红 = 合入阻断。e2e/视觉不在这里跑（需 CDP 起真实窗口，另列 workflow 或本地）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      # Windows runner 中文输出编码崩溃的既有坑：强制 UTF-8
      - name: typecheck
        working-directory: app
        run: npm run typecheck
        env:
          PYTHONIOENCODING: utf-8

      - name: build
        working-directory: app
        run: npm run build

      - name: cargo test
        working-directory: engine-rs
        run: cargo test --locked

      - name: cargo build release (引擎产物存在性)
        working-directory: engine-rs
        run: cargo build --release --locked
