# 守门三件套：clone 可构建 + 类型零错 + Rust 单测真的被跑。
# 任何一项红 = 合入阻断。e2e/视觉不在这里跑（需 CDP 起真实窗口，另列 workflow 或本地）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 44 要求 Node >= 22.12：用 Node 20 时 electron 的二进制不会落地，
          # 静态闸里的 CDP 段会报 spawn electron.exe ENOENT。
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      # Windows runner 中文输出编码崩溃的既有坑：强制 UTF-8
      - name: typecheck
        working-directory: app
        run: npm run typecheck
        env:
          PYTHONIOENCODING: utf-8

      - name: build
        working-directory: app
        run: npm run build

      # grep 验收闸（秒级）+ 这批脚本自带的 CDP 运行时闸（起真实窗口，验证 IPC 与弹层）。
      # 本地手跑 acceptance 脚本闭了本机，但合入前谁都有忘跑的可能——进 CI 兜底。
      - name: regression static (grep gates)
        working-directory: app
        run: npm run regression:static

      # lint：错误 = 合入阻断（0 errors 闸）；警告是渐进债务台账，不阻断。
      #   no-console 提醒走 logger；未用变量提醒清尾。新代码必须过。
      - name: lint (0 errors)
        working-directory: app
        run: npx eslint src tests --max-warnings 9999

      # 单元测试（node:test，构建到 .test-build 再跑）——format/工具函数回归网
      - name: unit tests
        working-directory: app
        run: npm test

      - name: cargo test
        working-directory: engine-rs
        run: cargo test --locked

      - name: cargo build release (引擎产物存在性)
        working-directory: engine-rs
        run: cargo build --release --locked
