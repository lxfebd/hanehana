# 守门三件套：clone 可构建 + 类型零错 + Rust 单测真的被跑。
# 任何一项红 = 合入阻断。下载 e2e（HTTPS fixture + 真实引擎）也进来了，排在 cargo build 之后（引擎产物就位才起得来）；
# static / layers / 下载 e2e 都在 PR 主链路里。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    # 整 job 上限：下载 e2e 单项最多 20min，其余步骤（typecheck/build/单测/cargo）
    # 正常几分钟内结束；60min 防「卡死挂到 runner 默认 6 小时」白烧分钟数。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 44 要求 Node >= 22.12：用 Node 20 时 electron 的二进制不会落地，
          # 静态闸里的 CDP 段会报 spawn electron.exe ENOENT。
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      # Electron 44 起 npm 不再 postinstall 下载二进制：require('electron') 时才惰性落地。
      # 不显式装一次，acceptance 脚本直接 spawn dist/electron.exe 会 ENOENT。
      - name: install electron binary
        working-directory: app
        run: npx install-electron

      # Windows runner 中文输出编码崩溃的既有坑：强制 UTF-8
      - name: typecheck
        working-directory: app
        run: npm run typecheck
        env:
          PYTHONIOENCODING: utf-8

      - name: build
        working-directory: app
        run: npm run build

      # grep 验收闸（秒级）+ 这批脚本自带的 CDP 运行时闸（起真实窗口，验证 IPC 与弹层）。
      # 本地手跑 acceptance 脚本闭了本机，但合入前谁都有忘跑的可能——进 CI 兜底。
      - name: regression static (grep gates)
        working-directory: app
        run: npm run regression:static

      # 层叠闸：真机起窗口，elementFromPoint 断言弹层不被封面卡片覆盖
      # （backdrop-filter 把 z-index 关进祖先层叠上下文的既存事故类）。
      # 原先只在本地 / visual.yml 跑，PR 改 z-index 合进来时线上不拦。
      - name: regression layers (CDP)
        working-directory: app
        run: npm run regression:layers
        env:
          PYTHONIOENCODING: utf-8

      # lint：错误 = 合入阻断（0 errors 闸）；警告是渐进债务台账，不阻断。
      #   no-console 提醒走 logger；未用变量提醒清尾。新代码必须过。
      - name: lint (0 errors)
        working-directory: app
        run: npx eslint src tests --max-warnings 9999

      # 单元测试（node:test，构建到 .test-build 再跑）——format/工具函数回归网
      - name: unit tests
        working-directory: app
        run: npm test

      - name: cargo test
        working-directory: engine-rs
        run: cargo test --locked

      - name: cargo build release (引擎产物存在性)
        working-directory: engine-rs
        run: cargo build --release --locked

      # 下载 e2e（30 条）：HTTPS fixture + 真实引擎全链路。必须排在 cargo build 之后——
      # enginePath() 找的就是 engine-rs/target/release，引擎不在时这条只会红在「找不到引擎」上。
      # 此前 PR 主链路只跑 static + layers，下载回归出问题合进来线上不拦。
      - name: regression download (e2e, CDP + HTTPS fixture + real engine)
        working-directory: app
        # 本地实测 2–4 分钟；卡住时（引擎握手/端口/磁盘）不给它拖满整个 job 预算。
        timeout-minutes: 20
        run: npm run regression:download
        env:
          PYTHONIOENCODING: utf-8
